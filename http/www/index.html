<!doctype html>
<html lang="de">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <meta name="color-scheme" content="light dark">
   <meta name="mobile-web-app-capable" content="yes">
   <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
   <title>EPGd</title>
   <link rel="icon" href="images/favicon.ico">
   <link rel="apple-touch-icon" href="images/epgd-4x.png">
   <script>
      // apply the stored theme before the first paint (see js/theme.js)
      try {
         const t = JSON.parse(localStorage.getItem('epgd.theme') || '{}');
         if (t.mode === 'light' || t.mode === 'dark') document.documentElement.setAttribute('data-theme', t.mode);
         if (t.accent) document.documentElement.style.setProperty('--accent', t.accent);
      } catch (e) { }
   </script>
   <link rel="stylesheet" href="css/epgd.css">
   <link rel="stylesheet" href="css/custom.css">
   <script src="vendor/jquery-3.7.1.min.js"></script>
   <script type="module" src="js/app.js"></script>
</head>
<body></body>
</html>
